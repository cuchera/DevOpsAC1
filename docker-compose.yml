services:
  postgres:
    image: postgres:16
    container_name: ac1-postgres
    environment:
      POSTGRES_DB: ac1db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: ./AC1
    container_name: ac1-app
    depends_on:
      - postgres
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres

volumes:
  postgres_data: