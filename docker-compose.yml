services:
  postgres:
    image: postgres:16
    container_name: ac1-postgres
    environment:
      POSTGRES_DB: ac1db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: ac1-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  app:
    build:
      context: ./AC1
    container_name: ac1-app
    depends_on:
      - postgres
      - ai-service
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      AI_SERVICE_BASE_URL: http://ai-service:8000
      # Desafio 6: liga a falha simulada da notificacao (SIMULAR_FALHA_NOTIFICACAO=true)
      APP_NOTIFICACAO_SIMULARINDISPONIBILIDADE: ${SIMULAR_FALHA_NOTIFICACAO:-false}

  ai-service:
    build:
      context: ./ai-service
    container_name: ac1-ai-service
    ports:
      - "8001:8000"

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ac1-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  # Desafio 6 - Observabilidade
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ac1-prometheus
    volumes:
      - ./observabilidade/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app
      - ai-service

  grafana:
    image: grafana/grafana:11.3.0
    container_name: ac1-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidade/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  pgadmin_data:
  grafana_data: